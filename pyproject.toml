[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "openghg"
dynamic = ["version"]
description = "OpenGHG: A platform for greenhouse​ gas data analysis"
readme = "README.md"
requires-python = ">=3.10"
license-files = ["LICEN[CS]E*"]
authors = [
    { name = "Prasad Sutar", email = "prasad.sutar@bristol.ac.uk" },
    { name = "Brendan Murphy", email = "brendan.murphy@bristol.ac.uk" },
    { name = "Rachel Tunnicliffe", email = "rachel.tunnicliffe@bristol.ac.uk" },
    { name = "Gareth Jones", email = "g.m.jones@bristol.ac.uk" }
]
maintainers = [
    { name = "Prasad Sutar", email = "prasad.sutar@bristol.ac.uk" },
    { name = "Brendan Murphy", email = "brendan.murphy@bristol.ac.uk" },
    { name = "Rachel Tunnicliffe", email = "rachel.tunnicliffe@bristol.ac.uk" }
]

dependencies = [
    "addict<=2.4.0",
    "cdsapi>=0.7.7",
    "cf-xarray<=0.10.6",
    "dask<2026.8",
    "filelock<=3.32.3",
    "flox<=0.10.4",
    "h5netcdf>=1.0.0, <=1.8.1",
    "h5py<3.17",
    "icoscp<=0.2.3",
    "ipykernel>=6.29.5",
    "ipywidgets<=8.1.8",
    "kaleido>=1.3.0",
    "matplotlib<=3.10.9",
    "msgpack<=1.2.1",
    "msgpack-types<=0.8.0",
    "nbformat<=5.11.0",
    "nc-time-axis<=1.4.1",
    "netcdf4>=1.6.0, <=1.7.2",
    "networkx<=3.4.2",
    "numcodecs<0.16",
    "numexpr<=2.14.1",
    "numpy>=2.0, <=2.3.3",
    "openghg-calscales<=0.1.3",
    "openghg-defs>=0.0.10",
    "openpyxl<=3.1.5",
    "pandas>=2.0, <=2.3.3",
    "pint<=0.24.4",
    "pint-xarray<=0.5.1",
    "plotly<=6.9.0",
    "pre-commit>=4.6.0",
    "pytest>=7.0.0",
    "pytest-mock>=3.15.1",
    "pyvis<=0.3.2",
    "rapidfuzz<=3.14.5",
    "requests<=2.34.2",
    "rich<=15.0.0",
    "scipy<=1.15.3",
    "sympy<=1.14.0",
    "tinydb<=4.9.0",
    "toml<=0.10.2",
    "urllib3>=1.26.3",
    "xarray>=2025.4.0, <=2025.9.1",
    "zarr==2.18.3",
]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS"]
[project.optional-dependencies]
    dev = [
        "black==26.5.1",
        "cfchecker",
        "flake8<=7.3.0",
        "mypy==2.3.0",
        "pre-commit<=4.6.2",
        "pytest<=7.0.0",
        "pytest-cov<=7.1.0",
        "pytest-mock<=3.15.1",
        "pytest-timeout>=2.4.0,<3.0.0",
        "pytest-tornasync<=0.6.0.post2",
        "requests-mock<=1.12.1",
        "tox<=4.60.0",
        "types-paramiko<=5.0.0.20260724",
        "types-pyyaml<=6.0.12.20260724",
        "types-requests<=2.33.0.20260712",
        "types-toml<=0.10.8.20260518",
        "types-urllib3",
    ]
    doc = [
        "sphinx",
        "Jinja2",
        "notebook",
        "sphinxcontrib-programoutput",
        "sphinx-togglebutton",
        "sphinx_rtd_theme<3.2.0",
        "sphinx-autodoc-typehints",
        "myst-parser<=4.0.1",
        "sphinx-copybutton<=0.5.2",
        "sphinxcontrib-bibtex<=2.7.0",
        "sphinxcontrib-mermaid<=2.1.0",
        "sphinx-autobuild<=2024.10.3",
        "nbsphinx<=0.9.8",
        "ipython<=8.39.0",
        "jupyter_client<=8.9.1",
        "jupyter_core<=5.9.1",
        "jupyter-sphinx",
        "nbconvert<=7.17.1",
        "docutils<=0.23",
        "sphinx-issues<=6.0.0",
        "pydata-sphinx-theme<=0.19.0"
    ]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64"]

[tool.pixi.dependencies]
# Use the oldest CI Python version for the reproducible Pixi development environment.
python = "3.10.*"
pip = "*"

# Keep the fragile compiled scientific and HDF5/NetCDF stack on conda-forge.
# These entries override matching PyPI dependencies from this project.
cf_xarray = "<=0.10.6"
cftime = "*"
filelock = "<=3.29.0"
flox = "<=0.10.4"
hdf5 = "*"
h5netcdf = ">=1.0.0,<=1.8.1"
h5py = "<3.15"
libnetcdf = "*"
matplotlib = ">=3.5,<=3.10.7"
msgpack-python = ">=1.0,<=1.1.1"
nc-time-axis = "<=1.4.1"
netcdf4 = ">=1.6.0,<=1.7.2"
numcodecs = "<0.16"
numexpr = "<=2.14.1"
numpy = ">=2.0,<=2.3.3"
pandas = ">=2.0,<=2.3.3"
rapidfuzz = "<=3.14.5"
scipy = ">=1.10,<=1.15.3"
urllib3 = ">=1.26.3,<1.27"
xarray = ">=2025.4.0,<=2025.9.1"
zarr = "==2.18.3"

[tool.pixi.pypi-dependencies]
openghg = { path = ".", editable = true }

[tool.pixi.environments]
default = { features = [], solve-group = "default" }
dev = { features = ["pixi-dev"], solve-group = "default" }

[tool.pixi.feature.pixi-dev.dependencies]
black = "==26.5.1"
flake8 = "<=7.3.0"
mypy = "==2.1.0"
pre-commit = "<=4.6.0"
pytest = "<=7.0.0"
pytest-cov = "<=7.0.0"
pytest-mock = "<=3.15.1"
pytest-timeout = ">=2.4.0,<3.0.0"
pytest-tornasync = "<=0.6.0.post2"
types-paramiko = "<=4.0.0.20260518"
types-pyyaml = "<=6.0.12.20250915"
types-requests = "<=2.33.0.20260518"
types-toml = "<=0.10.8.20240310"
types-urllib3 = "*"

[tool.pixi.feature.pixi-dev.pypi-dependencies]
cfchecker = { git = "https://github.com/openghg/cf-checker", rev = "master" }
msgpack-types = "<=0.7.0"
requests-mock = "<=1.12.1"

[tool.pixi.feature.pixi-dev.tasks]
test = "pytest"
test-storage = "pytest tests/storage/test_store.py tests/store/test_obssurface.py::test_read_CRDS tests/store/test_footprints.py::test_read_footprint_high_spatial_resolution"
lint = "black --check openghg && flake8 openghg"
typecheck = "mypy openghg"

[tool.uv.sources]
cfchecker = { git = "https://github.com/openghg/cf-checker", rev = "master" }

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.sdist]
include = ["openghg*", "recipes*"]

[tool.hatch.build.targets.wheel]
include = ["openghg*", "recipes*"]
[project.urls]
Documentation = "https://www.openghg.org"
Code = "https://github.com/openghg/openghg"
Issue-Tracker = "https://github.com/openghg/openghg/issues"

[tool.uv-dynamic-versioning]
pattern = "default-unprefixed"
fallback-version = "0.0.0"

[project.scripts]
openghg = "openghg.util:cli"

[tool.setuptools.package-data]
"*" = ["data/*", "data/config/objectstore/*", "py.typed"]

[tool.versioneer]
VCS = "git"
style = "pep621"
versionfile_source = "openghg/_version.py"
versionfile_build = "openghg/_version.py"
tag_prefix = ""
parentdir_prefix_version = "openghg-"

[tool.black]
line-length = 110

[tool.pytest.ini_options]
pythonpath = [
    "."
]
timeout = 300
markers = [
    "xesmf: marks tests as requiring xesmf (deselect with '-m \"not xesmf\"')"
]
