
{% set conda_env = load_file_data('../environment.yaml', from_recipe_dir=True) %}
# We trim the pip dictionary from the end of the list
# This is a bit fragile but pip should be at the end
{% set deps = conda_env["dependencies"][:-1] %}

package:
  name: "openghg"
  version: {{ GIT_TAG }}

source:
  git_url: https://github.com/openghg/openghg.git
  git_rev: {{ GIT_TAG }}

build:
  noarch: python
  preserve_egg_dir: True
  script: "{{ PYTHON }} -m pip install . -vv"
  script_env:
    GIT_TAG

requirements:
  host:
    - pip
    - python
    - hatchling
    - uv-dynamic-versioning
    - setuptools
  # These differ slightly from requirements as some
  # packages such as icoscp aren't available on conda
  run:
    {% for package in deps %}
    - {{ package }}
    {% endfor %}

test:
  commands:
    - python -m pip install "icoscp<=0.2.3" "xarray-validate==0.0.5" "numpy>=2.0"
    - python -c "import openghg"
    - python -c "import openghg.analyse"
    - python -c "import openghg.dataobjects"
    - python -c "import openghg.objectstore"
    - python -c "import openghg.plotting"
    - python -c "import openghg.retrieve"
    - python -c "import openghg.retrieve.icos"
    - python -c "import openghg.retrieve.ceda"
    - python -c "import openghg.service"
    - python -c "import openghg.standardise"
    - python -c "import openghg.standardise.meta"
    - python -c "import openghg.standardise.surface"
    - python -c "import openghg.store"
    - python -c "import openghg.store.base"
    - python -c "import openghg.store._data_schema"
    - python -c "import openghg.transform"
    - python -c "import openghg.types"
    - python -c "import openghg.util"

about:
  home: "https://github.com/openghg/openghg"
  license: Apache-2.0
  license_family: APACHE
  summary: "OpenGHG - a cloud platform for greenhouse gas data analysis"
  doc_url: https://docs.openghg.org
  dev_url: "https://github.com/openghg/openghg"

extra:
  recipe-maintainers:
    - gareth-j
