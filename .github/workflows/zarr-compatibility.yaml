name: Existing Zarr store compatibility

on:
  pull_request:
    branches: [master, devel]
  push:
    branches: [master, devel]
  workflow_dispatch:

jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      PYTHONPATH: ${{ github.workspace }}
      OPENGHG_LEGACY_PYTHON: ${{ github.workspace }}/.venv-legacy/bin/python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install the upgraded environment
        run: uv sync --locked --extra dev
      - name: Prepare the pre-upgrade writer and reader
        run: |
          uv pip freeze --exclude-editable > /tmp/legacy-requirements.txt
          cat > /tmp/legacy-overrides.txt <<'EOF'
          xarray==2025.9.1
          zarr==2.18.3
          numcodecs==0.15.1
          EOF
          uv venv .venv-legacy
          uv pip install --python "$OPENGHG_LEGACY_PYTHON" -r /tmp/legacy-requirements.txt --overrides /tmp/legacy-overrides.txt
      - name: Verify storage regressions with the pre-upgrade dependencies
        run: >-
          "$OPENGHG_LEGACY_PYTHON" -m pytest -v
          tests/storage/test_zarr_compat.py
          tests/storage/test_versioned_zarr_copy.py
          tests/storage/test_zarr_write_safety.py
      - name: Verify existing user, group and shared stores across the upgrade
        run: uv run --no-sync pytest -v tests/storage/test_existing_stores.py
