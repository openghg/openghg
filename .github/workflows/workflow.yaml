name: OpenGHG tests

on:
  push:
    branches: [master, devel]
    tags:
      - "*"
    paths-ignore:
      - 'CHANGELOG.md'
  pull_request:
    paths-ignore:
      - 'CHANGELOG.md'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag value to validate without releasing"
        required: true
        default: "1.2.3"
        type: string

jobs:
  release_tag:
    name: Check for a release tag
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.check.outputs.is_release }}
    steps:
      - name: Validate release tag
        id: check
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            is_release=true
          else
            is_release=false
          fi
          echo "Tag '$TAG': is_release=$is_release"
          echo "is_release=$is_release" >> "$GITHUB_OUTPUT"

  test:
    name: Run the tests
    runs-on: ${{ matrix.operating-system }}
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        operating-system: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Install project (including dev dependencies)
        run: uv sync --extra dev --extra fp-x-flux

      - name: Check formatting with Ruff
        run: |
          uv run ruff format --check openghg/

      - name: Lint with Ruff
        run: |
          uv run ruff check openghg/

      - name: Run mypy
        run: uv run mypy --python-version ${{ matrix.python-version }} openghg/

      - name: Create mock cdsapi config file
        run: |
          echo $'url: https://www.openghg.org\nkey: 00000:f5690ad7-test-test-test-6fb0573991ca\n' > ~/.cdsapirc
      - name: Install udunits package for CF compliance checks
        run: |
          sudo apt-get install libudunits2-0
      - name: Test with pytest
        run: |
          uv run pytest --run-cfchecks
  docs:
    name: Build and deploy the documentation
    if: github.event_name == 'push' && needs.release_tag.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    needs: ["test", "release_tag"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install project with doc extras
        run: uv sync --extra doc

      - name: Setup default config
        run: uv run openghg --default-config

      - name: Install pandoc
        run: sudo apt-get install -y pandoc

      - name: Build documentation
        run: |
          cd doc
          uv run make html
      - name: Deploy to GitHub pages
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          branch: gh-pages
          folder: "doc/build/html"
          clean: true

  release_testpypi:
    name: TestPyPI Build and publish Python distributions (PEP 621, Trusted Publishing)
    needs: ["test", "docs", "release_tag"]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && needs.release_tag.outputs.is_release == 'true'
    environment:
      name: testpypi
      url: https://test.pypi.org/p/openghg
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Build distributions with uv
        run: uv build

      - name: Publish to TestPyPI
        run: uv publish --publish-url https://test.pypi.org/legacy/ --trusted-publishing always

  release_pypi:
    name: PyPI Build and publish Python distributions (PEP 621, Trusted Publishing)
    runs-on: ubuntu-latest
    needs: ["test", "docs", "release_testpypi", "release_tag"]
    if: github.event_name == 'push' && needs.release_tag.outputs.is_release == 'true'
    environment:
      name: pypi
      url: https://pypi.org/p/openghg
    permissions:
      id-token: write  # Required for Trusted Publishing
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Build distributions with uv
        run: uv build

      - name: Publish
        run: uv publish --trusted-publishing always

  release_conda:
    name: Build and publish conda package
    runs-on: ubuntu-latest
    needs: ["test", "docs", "release_tag"]
    if: github.event_name == 'push' && needs.release_tag.outputs.is_release == 'true'
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7
      - uses: mamba-org/setup-micromamba@v3
        with:
          init-shell: bash
      - name: Build and push the conda package
        run: |
          micromamba create -n openghg_build anaconda-client boa conda-verify -c conda-forge
          micromamba activate openghg_build
          conda config --append channels openghg
          mkdir ${{ github.workspace }}/build
          conda mambabuild --croot ${{ github.workspace }}/build recipes -c conda-forge
        env:
          GIT_TAG: ${{ github.ref_name }}
      - name: Publish build to Anaconda
        run: |
          micromamba activate openghg_build
          BUILD_DIR=${GITHUB_WORKSPACE}/build
          BUILD=$(find "$BUILD_DIR" -name '*.tar.bz2')
          anaconda --token "$ANACONDA_TOKEN" upload --user openghg --label main "$BUILD"
        env:
          ANACONDA_TOKEN: ${{ secrets.ANACONDA_TOKEN_EXP_2030_08_29 }}
          GIT_TAG: ${{ github.ref_name }}
