name: Zarr storage compatibility

on:
  pull_request:
  push:
    branches: [master, devel]
  workflow_dispatch:

jobs:
  storage:
    name: Storage with zarr-python ${{ matrix.zarr }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zarr: ["2.18.3", "3.1.6"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install the normal development environment
        run: uv sync --extra dev
      - name: Select the Zarr runtime for this compatibility lane
        run: uv pip install "zarr==${{ matrix.zarr }}"
      - name: Test storage without restoring the default Zarr pin
        run: >-
          uv run --no-sync pytest -v tests/storage tests/store/test_datasource.py
          tests/store/test_datasource_edit.py tests/store/test_datasource_edit_backend.py
          tests/dataobjects/test_datasource_handle.py
