name: Graphify freshness

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    name: Check generated repository graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.12"
      - name: Check the generated code graph
        run: python scripts/update_graphify.py --check
