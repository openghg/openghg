name: Create conda environment and run tests

on:
  push:
    branches: [master, devel]
    tags:
      - "*"
    paths-ignore:
      - 'CHANGELOG.md'
  pull_request:
    branches: [master, devel]
  workflow_dispatch:

jobs:
  test:
    name: Run tests on (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: ["ubuntu-latest"]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - name: Check for changelog-only changes
        id: changes
        if: github.event_name == 'pull_request'
        run: |
          # Compare the PR merge commit with its first parent (the base).
          changed_files="$(git diff --name-only --no-renames HEAD^1 HEAD)"
          if [[ "$changed_files" == "CHANGELOG.md" ]]; then
            echo "changelog_only=true" >> "$GITHUB_OUTPUT"
            echo "Skipping setup and tests for a changelog-only pull request."
          fi
      - uses: mamba-org/setup-micromamba@v3
        if: steps.changes.outputs.changelog_only != 'true'
        with:
          environment-file: environment.yaml
          cache-environment: true
          post-cleanup: "all"
          init-shell: bash
          create-args: >-
            -f environment-dev.yaml
            python=${{ matrix.python-version }}
      - name: List installed packages
        if: steps.changes.outputs.changelog_only != 'true'
        run: micromamba list
        shell: micromamba-shell {0}
      - name: Install OpenGHG
        if: steps.changes.outputs.changelog_only != 'true'
        run: conda develop .
        shell: micromamba-shell {0}
      - name: Run the tests
        if: steps.changes.outputs.changelog_only != 'true'
        run: pytest -v tests/
        shell: micromamba-shell {0}
